// ---------- helpers ----------
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

var state = {
  route: 'home',
  lang: (function () { try { return localStorage.getItem('okb-lang') || 'fr'; } catch (e) { return 'fr'; } })(),
  theme: (function () { try { return localStorage.getItem('okb-theme') || 'dark'; } catch (e) { return 'dark'; } })()
};

function parseHash() {
  var h = (location.hash || '').replace(/^#\/?/, '');
  if (h.indexOf('docs') === 0) return 'docs';
  return 'home';
}

function setLang(l) {
  try { localStorage.setItem('okb-lang', l); } catch (e) {}
  state.lang = l;
  render();
}

function setTheme(tm) {
  try { localStorage.setItem('okb-theme', tm); } catch (e) {}
  document.documentElement.setAttribute('data-theme', tm);
  state.theme = tm;
  renderThemeToggle();
}

function toggleTheme() { setTheme(state.theme === 'dark' ? 'light' : 'dark'); }

function scrollToId(id) {
  var el = document.getElementById(id);
  if (el) window.scrollTo({ top: window.scrollY + el.getBoundingClientRect().top - 84, behavior: 'smooth' });
}

// ---------- render ----------
var MOON_SVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path></svg>';
var SUN_SVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>';

function renderThemeToggle() {
  var btn = document.getElementById('theme-toggle');
  var dark = state.theme === 'dark';
  var label = dark
    ? (state.lang === 'fr' ? 'Mode jour' : 'Light mode')
    : (state.lang === 'fr' ? 'Mode nuit' : 'Dark mode');
  btn.innerHTML = dark ? MOON_SVG : SUN_SVG;
  btn.title = label;
  btn.setAttribute('aria-label', label);
}

function applyStaticI18n(t) {
  document.querySelectorAll('[data-i18n]').forEach(function (node) {
    var path = node.getAttribute('data-i18n').split('.');
    var v = t; for (var i = 0; i < path.length; i++) v = v[path[i]];
    node.textContent = v;
  });
  // lang toggle button styles
  var activeBtn = "font-family:inherit;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:7px;border:none;cursor:pointer;background:linear-gradient(135deg,#8b6bff,var(--accent));color:#0a0a0f;";
  var idleBtn = "font-family:inherit;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:7px;border:none;cursor:pointer;background:transparent;color:var(--text-dim);";
  document.getElementById('lang-fr').style.cssText = state.lang === 'fr' ? activeBtn : idleBtn;
  document.getElementById('lang-en').style.cssText = state.lang === 'en' ? activeBtn : idleBtn;
  renderThemeToggle();
}

function render() {
  var t = DICTS[state.lang];
  document.documentElement.lang = state.lang;
  applyStaticI18n(t);
  var view = document.getElementById('view');
  var html = (state.route === 'docs') ? docsView(t) : homeView(t);
  view.innerHTML = html;
  // restart entrance animation
  view.style.animation = 'none'; void view.offsetWidth; view.style.animation = '';
}

window.addEventListener('hashchange', function () {
  state.route = parseHash();
  render();
  window.scrollTo(0, 0);
});

document.documentElement.setAttribute('data-theme', state.theme);
state.route = parseHash();
render();
</script>
