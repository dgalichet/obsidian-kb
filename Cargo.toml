[package]
name = "obsidian-kb"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local-first hybrid retrieval CLI for Obsidian vaults"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/dgalichet/obsidian-kb"
repository = "https://github.com/dgalichet/obsidian-kb"
documentation = "https://docs.rs/obsidian-kb"
keywords = ["obsidian", "markdown", "search", "bm25", "rag"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1"
blake3 = "1"
camino = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
dirs = "6"
fastembed = { version = "5.13.3", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
globset = "0.4"
ignore = "0.4"
indicatif = "0.17"
owo-colors = "4"
rayon = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tantivy = { version = "0.26", default-features = false, features = ["mmap"] }
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
